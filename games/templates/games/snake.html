<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap');
    
    #snake-canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 4/3;
        display: block;
        background-color: #212529; /* Ink from palette */
        image-rendering: pixelated;
    }
    .score-overlay {
        position: absolute;
        top: 1rem;
        left: 1.5rem;
        font-family: 'Space Mono', monospace;
        color: #FFFFFF;
        font-size: 1.5rem;
        text-shadow: 2px 2px 0px #FB5607;
        pointer-events: none;
    }
    .game-over-screen {
        position: absolute;
        inset: 0;
        background: rgba(33, 37, 41, 0.85); /* Ink transparent */
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .game-over-screen h2 {
        font-family: 'Space Mono', monospace;
        font-size: 3rem;
        color: #FB5607;
        text-shadow: 4px 4px 0px #8338EC;
        margin-bottom: 1rem;
    }
</style>

<div class="relative w-full">
    <canvas id="snake-canvas" width="800" height="600"></canvas>
    
    <div class="score-overlay">
        SCORE: <span id="score">0</span>
    </div>

    <div class="game-over-screen" id="game-over">
        <h2>GAME OVER</h2>
        <button id="restart-btn" class="btn-neo btn-neo-yellow text-xl px-8 py-3 mt-4" style="font-family: 'Space Mono', monospace;">
            TRY AGAIN
        </button>
    </div>
</div>

<script>
    const canvas = document.getElementById('snake-canvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const gameOverScreen = document.getElementById('game-over');
    const restartBtn = document.getElementById('restart-btn');

    // Palette Colors
    const COLOR_BG = '#212529'; // Ink
    const COLOR_SNAKE = '#8338EC'; // Purple
    const COLOR_SNAKE_HEAD = '#E9ECEF'; // Cream/White
    const COLOR_FOOD = '#FB5607'; // Orange
    const COLOR_GRID = '#2b3035';

    const gridSize = 25;
    const tileCountX = canvas.width / gridSize;
    const tileCountY = canvas.height / gridSize;

    let snake = [];
    let velocity = { x: 0, y: 0 };
    let food = { x: 15, y: 15 };
    let score = 0;
    let gameLoop;
    let isGameOver = false;
    let isPaused = false;
    let speed = 120; // ms per frame

    function initGame() {
        snake = [
            { x: 10, y: 10 },
            { x: 10, y: 11 },
            { x: 10, y: 12 },
        ];
        velocity = { x: 0, y: -1 };
        score = 0;
        speed = 120;
        isGameOver = false;
        isPaused = false;
        scoreElement.textContent = score;
        gameOverScreen.style.display = 'none';
        placeFood();
        
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, speed);
    }

    function placeFood() {
        food = {
            x: Math.floor(Math.random() * tileCountX),
            y: Math.floor(Math.random() * tileCountY)
        };
        // Ensure food doesn't spawn on snake
        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                placeFood();
                break;
            }
        }
    }

    function drawGrid() {
        ctx.strokeStyle = COLOR_GRID;
        ctx.lineWidth = 1;
        for (let i = 0; i < tileCountX; i++) {
            ctx.beginPath();
            ctx.moveTo(i * gridSize, 0);
            ctx.lineTo(i * gridSize, canvas.height);
            ctx.stroke();
        }
        for (let i = 0; i < tileCountY; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * gridSize);
            ctx.lineTo(canvas.width, i * gridSize);
            ctx.stroke();
        }
    }

    function update() {
        if (isPaused || isGameOver) return;

        // Move snake
        const head = { 
            x: snake[0].x + velocity.x, 
            y: snake[0].y + velocity.y 
        };

        // Check wall collision
        if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
            endGame();
            return;
        }

        // Check self collision
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                endGame();
                return;
            }
        }

        snake.unshift(head);

        // Check food collision
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.textContent = score;
            placeFood();
            // Increase speed slightly
            if (speed > 50) {
                speed -= 2;
                clearInterval(gameLoop);
                gameLoop = setInterval(update, speed);
            }
        } else {
            snake.pop(); // Remove tail if no food eaten
        }

        draw();
    }

    function draw() {
        // Clear background
        ctx.fillStyle = COLOR_BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawGrid();

        // Draw food
        ctx.fillStyle = COLOR_FOOD;
        // Draw square with small inner border for style
        ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

        // Draw snake
        for (let i = 0; i < snake.length; i++) {
            if (i === 0) {
                ctx.fillStyle = COLOR_SNAKE_HEAD;
            } else {
                ctx.fillStyle = COLOR_SNAKE;
            }
            
            // Draw segment slightly smaller than grid size to show gaps
            ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
        }
    }

    function endGame() {
        isGameOver = true;
        clearInterval(gameLoop);
        gameOverScreen.style.display = 'flex';
    }

    window.addEventListener('keydown', e => {
        // Prevent default scrolling for arrow keys and space
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }

        if (e.code === 'Space') {
            if (isGameOver) {
                initGame();
            } else {
                isPaused = !isPaused;
            }
            return;
        }

        if (isPaused) return;

        // Change direction (prevent 180-degree turns)
        switch (e.key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                if (velocity.y !== 1) velocity = { x: 0, y: -1 };
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                if (velocity.y !== -1) velocity = { x: 0, y: 1 };
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                if (velocity.x !== 1) velocity = { x: -1, y: 0 };
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                if (velocity.x !== -1) velocity = { x: 1, y: 0 };
                break;
        }
    });

    restartBtn.addEventListener('click', initGame);

    // Initial draw before start
    initGame();
    isPaused = true; 
    draw(); // Draw initial state
</script>
