{% extends "base.html" %}

{% block content %}
<div class="max-w-5xl mx-auto px-5 md:px-8 py-10">
    <div class="mb-6">
        <a href="{% url 'games_list' %}" class="inline-flex items-center text-sm font-bold hover:underline decoration-2 underline-offset-4">
            &larr; Back to Library
        </a>
    </div>

    <div class="card-neo bg-card p-6 md:p-8 mb-8">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8 border-b-neo border-ink pb-6">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight mb-2">{{ game.title }}</h1>
                <p class="text-sm font-medium max-w-xl">{{ game.description }}</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="fullscreen-btn" class="btn-neo btn-neo-white text-sm py-2">Full Screen</button>
            </div>
        </div>

        <div class="bg-ink rounded-neo-sm overflow-hidden border-neo border-ink shadow-neo" id="game-container">
            <!-- Embed specific game template -->
            {% include game.template_name %}
        </div>
        
        <div class="mt-6 flex flex-wrap gap-4 text-sm font-bold text-ink/70 justify-center">
            <span class="badge-neo bg-cream">Use Arrow Keys or WASD to move</span>
            <span class="badge-neo bg-cream">Press Space to Pause/Start</span>
        </div>
    </div>
</div>

<script>
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
        const container = document.getElementById('game-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                alert(`Error attempting to enable fullscreen: ${err.message} (${err.name})`);
            });
        } else {
            document.exitFullscreen();
        }
    });
</script>
{% endblock %}
