<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap');
    
    #tetris-container {
        width: 100%;
        display: flex;
        justify-content: center;
        background-color: #212529; /* Ink */
        padding: 2rem 0;
    }
    
    #tetris-canvas {
        background-color: #1a1d20; /* Darker Ink for play area */
        image-rendering: pixelated;
        border: 4px solid #E9ECEF;
    }
    
    .side-panel {
        width: 200px;
        margin-left: 2rem;
        font-family: 'Space Mono', monospace;
        color: #E9ECEF;
    }
    
    .score-box {
        background: #212529;
        border: 4px solid #FB5607;
        padding: 1rem;
        margin-bottom: 2rem;
        text-align: center;
    }
    
    .score-box h3 {
        color: #FB5607;
        margin-bottom: 0.5rem;
    }
    
    .game-over-screen {
        position: absolute;
        inset: 0;
        background: rgba(33, 37, 41, 0.85); /* Ink transparent */
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 20;
    }
    .game-over-screen h2 {
        font-family: 'Space Mono', monospace;
        font-size: 3rem;
        color: #FB5607;
        text-shadow: 4px 4px 0px #8338EC;
        margin-bottom: 1rem;
    }
</style>

<div class="relative w-full" id="tetris-container">
    <canvas id="tetris-canvas" width="300" height="600"></canvas>
    
    <div class="side-panel">
        <div class="score-box">
            <h3>SCORE</h3>
            <div id="score" class="text-2xl">0</div>
        </div>
        <div class="score-box" style="border-color: #8338EC;">
            <h3 style="color: #8338EC;">LINES</h3>
            <div id="lines" class="text-2xl">0</div>
        </div>
        <div class="text-sm mt-8 space-y-2 opacity-80">
            <p>← → : Move</p>
            <p>↑ : Rotate</p>
            <p>↓ : Drop Faster</p>
        </div>
    </div>

    <div class="game-over-screen" id="game-over">
        <h2>GAME OVER</h2>
        <button id="restart-btn" class="btn-neo btn-neo-yellow text-xl px-8 py-3 mt-4" style="font-family: 'Space Mono', monospace;">
            TRY AGAIN
        </button>
    </div>
</div>

<!-- Mobile Touch Controls -->
<div class="md:hidden mt-6 flex flex-col items-center gap-6 select-none touch-manipulation">
    <div class="grid grid-cols-3 gap-3">
        <div></div>
        <button id="btn-up" class="btn-neo btn-neo-white w-16 h-16 text-2xl flex items-center justify-center p-0">🔄</button>
        <div></div>
        <button id="btn-left" class="btn-neo btn-neo-white w-16 h-16 text-2xl flex items-center justify-center p-0">⬅️</button>
        <button id="btn-down" class="btn-neo btn-neo-white w-16 h-16 text-2xl flex items-center justify-center p-0">⏬</button>
        <button id="btn-right" class="btn-neo btn-neo-white w-16 h-16 text-2xl flex items-center justify-center p-0">➡️</button>
    </div>
    <button id="btn-action" class="btn-neo bg-[#8338EC] hover:bg-[#9d4edd] text-white w-64 py-4 text-xl font-bold tracking-[0.2em]">
        START / PAUSE
    </button>
</div>

<script>
    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const gameOverScreen = document.getElementById('game-over');
    const restartBtn = document.getElementById('restart-btn');

    // Tetris config
    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 30; // 30x10 = 300, 30x20 = 600

    ctx.scale(BLOCK_SIZE, BLOCK_SIZE);

    const COLORS = [
        null,
        '#FB5607', // Orange
        '#8338EC', // Purple
        '#E9ECEF', // Cream
        '#FB5607',
        '#8338EC',
        '#E9ECEF',
        '#FB5607'
    ];

    const PIECES = [
        [],
        [[1, 1, 1, 1]], // I
        [[2, 0, 0], [2, 2, 2]], // J
        [[0, 0, 3], [3, 3, 3]], // L
        [[4, 4], [4, 4]], // O
        [[0, 5, 5], [5, 5, 0]], // S
        [[0, 6, 0], [6, 6, 6]], // T
        [[7, 7, 0], [0, 7, 7]]  // Z
    ];

    let board = [];
    let player = {
        pos: {x: 0, y: 0},
        matrix: null,
    };
    
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let score = 0;
    let lines = 0;
    let isGameOver = false;
    let isPaused = true;

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = COLORS[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    ctx.strokeStyle = '#1a1d20';
                    ctx.lineWidth = 0.05;
                    ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function collide(board, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function merge(board, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    board[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function clearLines() {
        let linesCleared = 0;
        outer: for (let y = board.length - 1; y > 0; --y) {
            for (let x = 0; x < board[y].length; ++x) {
                if (board[y][x] === 0) {
                    continue outer;
                }
            }
            const row = board.splice(y, 1)[0].fill(0);
            board.unshift(row);
            ++y;
            linesCleared++;
        }
        
        if (linesCleared > 0) {
            lines += linesCleared;
            score += linesCleared * 100;
            dropInterval = Math.max(100, 1000 - (lines * 20));
            updateScore();
        }
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(board, player)) {
            player.pos.y--;
            merge(board, player);
            playerReset();
            clearLines();
        }
        dropCounter = 0;
    }

    function playerMove(offset) {
        player.pos.x += offset;
        if (collide(board, player)) {
            player.pos.x -= offset;
        }
    }

    function playerRotate() {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix);
        while (collide(board, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -1); // rotate back
                player.pos.x = pos;
                return;
            }
        }
    }

    function rotate(matrix, dir=1) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function playerReset() {
        const pieces = '1234567';
        const type = pieces[Math.floor(Math.random() * pieces.length)];
        player.matrix = JSON.parse(JSON.stringify(PIECES[type]));
        player.pos.y = 0;
        player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);
        
        if (collide(board, player)) {
            isGameOver = true;
            gameOverScreen.style.display = 'flex';
            
            if (score > 0) {
                setTimeout(() => {
                    const initials = prompt("GAME OVER!\nEnter 3-letter initials for the Global Leaderboard:", "AAA");
                    if (initials) {
                        fetch(`/games/{{ game.slug }}/submit_score/`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ initials: initials.substring(0,3), score: score })
                        }).then(() => { window.location.reload(); });
                    }
                }, 100);
            }
        }
    }

    function updateScore() {
        scoreEl.innerText = score;
        linesEl.innerText = lines;
    }

    function initGame() {
        board = createMatrix(COLS, ROWS);
        score = 0;
        lines = 0;
        dropInterval = 1000;
        updateScore();
        playerReset();
        isGameOver = false;
        isPaused = false;
        gameOverScreen.style.display = 'none';
        lastTime = 0;
        update();
    }

    function draw() {
        ctx.fillStyle = '#1a1d20';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(board, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    function update(time = 0) {
        if (isGameOver || isPaused) return;

        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        requestAnimationFrame(update);
    }

    window.addEventListener('keydown', e => {
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
            e.preventDefault();
        }
        
        if (e.code === 'Space') {
            if (isGameOver) {
                initGame();
            } else {
                isPaused = !isPaused;
                if (!isPaused) update(performance.now());
            }
            return;
        }

        if (isPaused || isGameOver) return;

        if (e.key === 'ArrowLeft') {
            playerMove(-1);
        } else if (e.key === 'ArrowRight') {
            playerMove(1);
        } else if (e.key === 'ArrowDown') {
            playerDrop();
        } else if (e.key === 'ArrowUp') {
            playerRotate();
        }
    });

    restartBtn.addEventListener('click', initGame);

    // Mobile Controls
    const handleAction = (e) => {
        if(e) e.preventDefault();
        if (isGameOver) {
            initGame();
        } else {
            isPaused = !isPaused;
            if (!isPaused) update(performance.now());
        }
    };

    document.getElementById('btn-up').addEventListener('pointerdown', (e) => { e.preventDefault(); if(!isPaused && !isGameOver) playerRotate(); });
    document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.preventDefault(); if(!isPaused && !isGameOver) playerDrop(); });
    document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); if(!isPaused && !isGameOver) playerMove(-1); });
    document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); if(!isPaused && !isGameOver) playerMove(1); });
    document.getElementById('btn-action').addEventListener('pointerdown', handleAction);

    // Initial draw
    board = createMatrix(COLS, ROWS);
    playerReset();
    draw();
    
</script>
