{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-5 md:px-8 py-10 md:py-16">
    <div class="flex items-center justify-between mb-10 border-b-neo border-ink pb-6">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">Game Library</h1>
        <div class="badge-neo bg-purple text-card px-3 py-1 text-sm">{{ games|length }} Games Available</div>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for game in games %}
        <div class="card-neo flex flex-col group h-full">
            <div class="relative aspect-video border-b-neo border-ink overflow-hidden bg-cream">
                {% if game.cover_image_url %}
                <img src="{{ game.cover_image_url }}" alt="{{ game.title }} Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                {% else %}
                <div class="w-full h-full flex items-center justify-center font-bold text-2xl opacity-20">No Image</div>
                {% endif %}
            </div>
            
            <div class="p-6 flex-1 flex flex-col">
                <div class="flex justify-between items-start mb-3">
                    <h2 class="text-2xl font-bold tracking-tight">{{ game.title }}</h2>
                </div>
                
                <p class="text-sm font-medium mb-6 flex-1">
                    {{ game.description|truncatewords:20 }}
                </p>
                
                <a href="{% url 'play_game' game.slug %}" class="btn-neo btn-neo-yellow w-full py-3">
                    Play Now
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
